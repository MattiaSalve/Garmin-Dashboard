[project]
name = "garmin-dashboards"
version = "0.1.0"
description = "Personal dashboard (FastAPI + React) for Garmin Connect activities"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "curl-cffi>=0.17.0",
    "fastapi>=0.162.2",
    "garminconnect>=0.3.20",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
garmin-dashboards = "garmin_dashboards:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
